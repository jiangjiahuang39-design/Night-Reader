name: iOS Unsigned IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: >-
          flutter build ios
          --release
          --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry night-reader-unsigned.ipa Payload)
          test -s "$RUNNER_TEMP/ipa/night-reader-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: night-reader-ios-unsigned
          path: ${{ runner.temp }}/ipa/night-reader-unsigned.ipa
          retention-days: 7