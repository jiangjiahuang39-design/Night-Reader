name: iOS IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          BUILD_NO="${{ github.run_number }}"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app \
            "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "Night-Reader-Unsigned-${BUILD_NO}.ipa" Payload
          test -s "Night-Reader-Unsigned-${BUILD_NO}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Night-Reader-iOS-IPA-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/Night-Reader-Unsigned-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 30